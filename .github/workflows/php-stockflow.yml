name: StockFlow PHP Tests

on:
  push:
    branches: [main]
    paths:
      - 'projects/php-mysql-stockflow/**'
      - '.github/workflows/php-stockflow.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/php-mysql-stockflow/**'
      - '.github/workflows/php-stockflow.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/php-mysql-stockflow

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, pdo
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint PHP source
        run: find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run PHPUnit
        run: composer test
